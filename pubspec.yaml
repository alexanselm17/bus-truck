name: school_tracker
description: Parents track school bus for their kids.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.2
  dio: ^5.0.0
  dropdown_search: ^7.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: 17.2.1
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.6.1
  font_awesome_flutter: ^11.0.0
  geolocator: ^14.0.2
  get: ^4.6.6
  get_it: ^9.3.0
  google_fonts: ^8.1.0
  google_maps_flutter: ^2.0.1
  http: ^1.1.0
  intl: ^0.20.3
  logger: ^2.6.1
  permission_handler: 12.0.3
  provider: ^6.0.2
  search_choices: ^2.3.1
  sentry_flutter: ^9.30.1
  shared_preferences: ^2.0.5
  url_launcher: ^6.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
